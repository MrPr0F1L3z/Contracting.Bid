name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres for test/pgdb.test.ts, which drops and recreates its schema.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # test/dashboardBrowser.test.ts drives the owner dashboard in Chromium.
      - run: pnpm exec playwright-core install --with-deps chromium
      # Tests use stub models and saved fixtures only. CI never calls Claude, vLLM or SAM.gov.
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
      # Deploy check: apply every migration to a fresh database the way a run does, then
      # again to show it is a no-op. A failing migration fails CI and is rolled back.
      - run: psql postgres://test:test@localhost:5432/test -c "CREATE DATABASE deploy"
      - run: pnpm db migrate && pnpm db migrate && pnpm db status
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/deploy

  # Deploy check for the stacks (docs/STACKS.md): each stack's Compose file must resolve, with
  # its own project, ports and APP_STACK, and Docker must get nothing from a stray .env.
  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render dev, staging and prod
        run: |
          set -eu
          docker compose config --format json > dev.json
          APP_IMAGE=contracting-bid:ci APP_BUILD=ci docker compose -p contracting-staging --env-file deploy/stacks/staging.env config --format json > staging.json
          APP_IMAGE=contracting-bid:ci APP_BUILD=ci docker compose -p contracting-prod --env-file deploy/stacks/prod.env config --format json > prod.json
          check() { jq -e "$2" "$1" > /dev/null || { echo "$1 failed: $2"; exit 1; }; }
          check dev.json '.services.dashboard.environment.APP_STACK == "dev" and .services.db.ports[0].published == "5432"'
          check staging.json '.name == "contracting-staging" and .services.dashboard.environment.APP_STACK == "staging" and .services.dashboard.ports[0].published == "4200" and .services.db.ports[0].published == "5433"'
          check prod.json '.name == "contracting-prod" and .services.dashboard.environment.APP_STACK == "prod" and .services.migrate.environment.APP_STACK == "prod" and .services.dashboard.ports[0].published == "4300" and .services.db.ports[0].published == "5434"'
          check prod.json '.volumes["db-data"].name == "contracting-prod_db-data"'
          check staging.json '.volumes["db-data"].name == "contracting-staging_db-data"'

  # The customer-facing site (web/). Front end only: no database, no model calls.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Deploy check: the production build must succeed, and the browser tests run against it.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The Hi-Vis template is the same site in the other design; build it and run the same browser tests.
      - run: pnpm build:hivis
      - run: pnpm e2e:hivis
