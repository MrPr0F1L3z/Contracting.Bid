# Runs on the owner's machine. The same file runs all three stacks:
#   dev:     docker compose up -d          (this checkout, sim data, the database you have today)
#   staging: pnpm stack deploy staging     (a committed build, sim data, its own database)
#   prod:    pnpm stack promote            (a build that passed staging, no sim data, its own database)
# staging and prod get their ports and names from deploy/stacks/STACK.env; see docs/STACKS.md.
# vLLM is NOT in this file: it already runs on
# the host GPU on port 8001. Note: vllm_service binds 127.0.0.1, which a container cannot reach via host.docker.internal.
# Nothing here uses network_mode: host, because Docker Desktop runs containers in a VM
# where "host" means the VM, not this machine.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: contracting
      POSTGRES_PASSWORD: contracting
      POSTGRES_DB: contracting
    ports:
      # Only this machine can reach the database, even when the dashboard is public.
      # dev 5432, staging 5433, prod 5434 (deploy/stacks/STACK.env).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracting"]
      interval: 5s
      retries: 10

  # Applies new schema migrations whenever the stack comes up, all in one transaction:
  # if one fails, none are applied and app does not start. Runs started on this machine
  # (pnpm sim) apply them the same way.
  migrate:
    build: .
    # dev builds this checkout; staging and prod run the image built from one commit.
    image: ${APP_IMAGE:-contracting-bid:dev}
    command: ["node", "dist/src/cli/db.js", "migrate"]
    environment:
      DATABASE_URL: postgres://contracting:contracting@db:5432/contracting
      # The database records the first stack that opens it and refuses any other.
      APP_STACK: ${APP_STACK:-dev}
    depends_on:
      db:
        condition: service_healthy

  # Runs the test suite in a container. Not started by "docker compose up";
  # run it with: docker compose --profile tools run --rm app
  app:
    build: .
    image: ${APP_IMAGE:-contracting-bid:dev}
    profiles: ["tools"]
    env_file:
      - path: ${SECRETS_FILE:-.env}
        required: false
    environment:
      APP_STACK: ${APP_STACK:-dev}
      # Inside Compose the database's host is "db", not localhost.
      DATABASE_URL: postgres://contracting:contracting@db:5432/contracting
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The owner dashboard as an always-on service (pnpm sim serve): start runs and
  # answer approvals from the page. Start it with: docker compose up -d dashboard
  # It is published only on this machine's 127.0.0.1 (DASHBOARD_PORT: dev 4100, staging 4200, prod 4300);
  # Caddy reaches it over the Compose network.
  dashboard:
    build: .
    image: ${APP_IMAGE:-contracting-bid:dev}
    command: ["node", "dist/src/cli/sim.js", "serve"]
    restart: unless-stopped
    env_file:
      # staging and prod read the checkout's .env through SECRETS_FILE (the Claude API key).
      - path: ${SECRETS_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgres://contracting:contracting@db:5432/contracting
      # prod: no Start a run tab, and every sim command refuses to run.
      APP_STACK: ${APP_STACK:-dev}
      APP_BUILD: ${APP_BUILD:-}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "4100"
      DASHBOARD_IN_CONTAINER: "1"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4100}:4100"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # HTTPS in front of the owner dashboard, with a Let's Encrypt certificate for
  # DASHBOARD_DOMAIN. Start it with: docker compose --profile public up -d caddy
  # Only one stack can hold ports 80 and 443; see docs/STACKS.md for pointing it at prod.
  # It needs ports 80 and 443 open to the internet for the certificate.
  caddy:
    image: caddy:2.10
    profiles: ["public"]
    restart: unless-stopped
    environment:
      # Optional here so that "docker compose up db" works without it; Caddy checks it when it starts.
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
    command: >-
      sh -c 'if [ -z "$$DASHBOARD_DOMAIN" ]; then echo "Set DASHBOARD_DOMAIN in .env (see README)" >&2; exit 1; fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - dashboard
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
