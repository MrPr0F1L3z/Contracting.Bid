# Runs on the owner's machine. vLLM is NOT in this file: it already runs on
# the host GPU on port 8001. Note: vllm_service binds 127.0.0.1, which a container cannot reach via host.docker.internal.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: contracting
      POSTGRES_PASSWORD: contracting
      POSTGRES_DB: contracting
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracting"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runs:/app/runs

volumes:
  db-data:
