# Runs on the owner's machine. vLLM is NOT in this file: it already runs on
# the host GPU on port 8001. Note: vllm_service binds 127.0.0.1, which a container cannot reach via host.docker.internal.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: contracting
      POSTGRES_PASSWORD: contracting
      POSTGRES_DB: contracting
    ports:
      # Only this machine can reach the database, even when the dashboard is public.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracting"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Compose the database's host is "db", not localhost.
      DATABASE_URL: postgres://contracting:contracting@db:5432/contracting
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runs:/app/runs

  # HTTPS in front of the owner dashboard, with a Let's Encrypt certificate for
  # DASHBOARD_DOMAIN. Start it with: docker compose --profile public up -d caddy
  # It uses the host network so it can reach the dashboard on 127.0.0.1, and
  # needs ports 80 and 443 open to the internet for the certificate.
  caddy:
    image: caddy:2.10
    profiles: ["public"]
    network_mode: host
    restart: unless-stopped
    environment:
      # Optional here so that "docker compose up db" works without it; Caddy checks it when it starts.
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-4100}
    command: >-
      sh -c 'if [ -z "$$DASHBOARD_DOMAIN" ]; then echo "Set DASHBOARD_DOMAIN in .env (see README)" >&2; exit 1; fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
